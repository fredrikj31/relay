x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----- DEVELOPMENT -----
  dev-database:
    container_name: relay-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: relay
    ports:
      - 5432:5432
    volumes:
      - database-data:/var/lib/postgresql
    logging: *default-logging

  # ----- PRODUCTION -----
  database:
    container_name: relay-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - prod
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: relay
    ports:
      - 4000:5432
    networks:
      - relay-network
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    container_name: relay-migrate
    image: fredrikj31/relay-backend:latest
    profiles:
      - prod
    environment:
      WEBSITE_BASE_URL: ${WEBSITE_BASE_URL}
      DATABASE_HOST: relay-database
      DATABASE_PORT: 5432
      DATABASE_NAME: relay
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    command: ["node", "build/migrate.js"]
    volumes:
      - ./api/drizzle:/app/drizzle:ro
    networks:
      - relay-network
    depends_on:
      database:
        condition: service_healthy
    logging: *default-logging

  backend:
    container_name: relay-backend
    image: fredrikj31/relay-backend:latest
    restart: always
    profiles:
      - prod
    environment:
      WEBSITE_BASE_URL: ${WEBSITE_BASE_URL}
      DATABASE_HOST: relay-database
      DATABASE_PORT: 5432
      DATABASE_NAME: relay
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    networks:
      - relay-network
      - cloudflared
    ports:
      - 4002:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  frontend:
    container_name: relay-frontend
    image: fredrikj31/relay-frontend:latest
    restart: always
    profiles:
      - prod
    environment:
      MY_APP_API_BASE_URL: ${MY_APP_API_BASE_URL}
    networks:
      - cloudflared
    ports:
      - 4003:80

networks:
  relay-network:
    driver: bridge
  cloudflared:
    external: true

volumes:
  database-data:
    name: relay-database-data
    driver: local
